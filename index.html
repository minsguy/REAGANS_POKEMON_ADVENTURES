<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokémon Adventures">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Reagan's Pokémon Adventures</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --ball: clamp(84px, 13vmin, 124px);
    --yellow: #ffcb05;
    --blue: #2a5bd7;
    --ink: #1a1a2e;
    --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--ink); color: #fff; font-family: var(--font);
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; }
  img { pointer-events: none; -webkit-user-drag: none; }
  .hidden { display: none !important; }

  /* ---------- layers ---------- */
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #000; }
  #nocam {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at 50% 30%, #3b6fd8 0%, #1e3a8a 45%, #0f172a 100%);
  }
  #nocam::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(#fff3 1.5px, transparent 1.5px);
    background-size: 42px 42px; opacity: .35;
  }
  #gl { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; display: block; }
  #world { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
  #labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #edges { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #fx { position: absolute; inset: 0; z-index: 8; pointer-events: none; width: 100%; height: 100%; }
  #look { position: absolute; inset: 0; z-index: 2; }

  /* ---------- 2D fallback sprites (feet on the floor, contact shadow) ---------- */
  .poke { position: absolute; left: 0; top: 0; width: var(--sz); height: var(--sz); will-change: transform; visibility: hidden; }
  .poke.on { visibility: visible; }
  .poke .img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .poke.shiny .img { filter: drop-shadow(0 0 14px #ffe36e) drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .poke .shadow { position: absolute; left: 12%; bottom: -4%; width: 76%; height: 14%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.5), rgba(0,0,0,0) 70%); }
  .poke.absorb { transition: transform .38s cubic-bezier(.5,0,.9,.4), opacity .38s; opacity: 0; }
  .poke.absorb .img { filter: brightness(4) saturate(0) drop-shadow(0 0 20px #ff4d4d); }
  .poke.pop .img { animation: pop .45s cubic-bezier(.2,1.6,.4,1) 1; }
  .poke.flee { transition: transform 1s ease-in, opacity 1s; opacity: 0; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  /* ---------- name labels above every Pokémon ---------- */
  .tag {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); will-change: transform;
    padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-weight: 700;
    font-size: clamp(13px, 2.2vmin, 18px); white-space: nowrap; visibility: hidden;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tag.on { visibility: visible; }
  .tag .sp { color: var(--yellow); }

  /* ---------- edge arrows ---------- */
  .edge {
    position: absolute; left: 0; top: 0; will-change: transform;
    display: flex; align-items: center; gap: 2px;
    padding: 4px 8px 4px 4px; border-radius: 999px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transform: translate(-50%, -50%);
  }
  .edge img { width: 44px; height: 44px; image-rendering: pixelated; }
  .edge .arrow { font-size: 26px; line-height: 1; color: var(--yellow); display: inline-block; }

  /* ---------- pokeball ---------- */
  #ball {
    position: absolute; left: 0; top: 0; width: var(--ball); height: var(--ball);
    z-index: 5; border-radius: 50%; will-change: transform; cursor: grab;
    background: linear-gradient(to bottom, #e83b3b 0 45%, #1c1c1c 45% 55%, #f5f5f5 55%);
    box-shadow: inset -6px -8px 14px rgba(0,0,0,.25), 0 10px 18px rgba(0,0,0,.45);
    border: 3px solid #1c1c1c;
  }
  #ball::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 34%; height: 34%;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: #f5f5f5; border: 6px solid #1c1c1c; box-sizing: border-box;
  }
  #ball::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 16%; height: 16%;
    transform: translate(-50%, -50%); border-radius: 50%; background: #d8d8d8;
  }
  #ball.hint { animation: nudge 1.4s ease-in-out infinite; }
  #ball.wobble { animation: wobble .62s ease-in-out 1; }
  #ball.burst { animation: burst .35s ease-out 1 forwards; }
  #ball.glow { box-shadow: 0 0 0 4px #fff, 0 0 30px 10px #ffe36e, 0 10px 18px rgba(0,0,0,.45); }
  @keyframes nudge { 0%,100% { margin-top: 0; } 50% { margin-top: -12px; } }
  @keyframes wobble {
    0% { rotate: 0deg; } 20% { rotate: -28deg; } 45% { rotate: 24deg; } 70% { rotate: -14deg; } 90% { rotate: 6deg; } 100% { rotate: 0deg; }
  }
  @keyframes burst { 0% { filter: brightness(1); } 40% { filter: brightness(3); } 100% { filter: brightness(1); opacity: 0; } }

  /* ---------- hud ---------- */
  #hud { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #dexBtn {
    position: absolute; left: calc(var(--sal) + 12px); top: calc(var(--sat) + 12px);
    display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px;
    border: 0; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff;
    font: 800 clamp(15px, 2.4vmin, 20px) var(--font); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  #dexBtn .dot {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #1c1c1c;
    background: linear-gradient(to bottom, #e83b3b 0 44%, #1c1c1c 44% 56%, #f5f5f5 56%);
  }
  #muteBtn {
    position: absolute; right: calc(var(--sar) + 12px); top: calc(var(--sat) + 12px);
    width: 46px; height: 46px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
    font-size: 22px; line-height: 46px; text-align: center; padding: 0;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  #radar {
    position: absolute; left: 50%; top: calc(var(--sat) + 10px); transform: translateX(-50%);
    width: clamp(88px, 14vmin, 120px); height: clamp(88px, 14vmin, 120px);
    pointer-events: none;
  }
  #msg {
    position: absolute; left: 50%; top: 32%; transform: translateX(-50%);
    padding: 12px 22px; border-radius: 16px; background: rgba(0,0,0,.6);
    font-size: clamp(18px, 3.2vmin, 28px); font-weight: 800; text-align: center;
    opacity: 0; transition: opacity .4s; pointer-events: none; max-width: 92vw;
  }
  #msg.show { opacity: 1; }
  #toast {
    position: absolute; left: 50%; bottom: calc(var(--sab) + var(--ball) + 64px); transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.7);
    font-size: clamp(15px, 2.6vmin, 22px); font-weight: 800; opacity: 0; transition: opacity .25s;
    pointer-events: none; white-space: nowrap; z-index: 7;
  }
  #toast.show { opacity: 1; }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);
    overflow-y: auto; touch-action: pan-y;
  }
  #start { background: radial-gradient(ellipse at 50% 20%, #3b6fd8 0%, #1e3a8a 50%, #0f172a 100%); }
  #start .logo { width: clamp(110px, 22vmin, 170px); height: auto; filter: drop-shadow(0 12px 16px rgba(0,0,0,.4)); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  h1 {
    margin: 12px 0 4px; font-size: clamp(30px, 7vmin, 56px); line-height: 1.05; color: var(--yellow);
    -webkit-text-stroke: 2px var(--blue); text-shadow: 3px 4px 0 var(--blue), 0 10px 20px rgba(0,0,0,.4);
    letter-spacing: .5px;
  }
  .sub { font-size: clamp(16px, 3vmin, 22px); opacity: .9; margin-bottom: 16px; max-width: 34ch; }
  .how { display: grid; gap: 10px; margin: 6px 0 22px; text-align: left; font-size: clamp(15px, 2.8vmin, 20px); }
  .how div { display: flex; align-items: center; gap: 12px; }
  .how span { font-size: 1.5em; }
  .btn {
    padding: 16px 34px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--yellow); color: var(--ink); font: 900 clamp(20px, 4vmin, 28px) var(--font);
    box-shadow: 0 6px 0 #c99a00, 0 12px 20px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a00, 0 6px 10px rgba(0,0,0,.35); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: none; font-size: clamp(16px, 3vmin, 20px); padding: 12px 24px; }
  .note { margin-top: 18px; font-size: 14px; opacity: .7; max-width: 40ch; }

  #result { background: rgba(10, 12, 40, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #result .art { width: clamp(180px, 40vmin, 320px); height: clamp(180px, 40vmin, 320px); object-fit: contain; filter: drop-shadow(0 16px 16px rgba(0,0,0,.5)); animation: land .6s cubic-bezier(.2,1.5,.4,1) 1; }
  #result.shiny .art { filter: drop-shadow(0 0 22px #ffe36e) drop-shadow(0 16px 16px rgba(0,0,0,.5)); }
  @keyframes land { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  #result h2 { margin: 6px 0 2px; font-size: clamp(28px, 6vmin, 46px); color: var(--yellow); -webkit-text-stroke: 1.5px var(--blue); text-shadow: 2px 3px 0 var(--blue); }
  #result .name { font-size: clamp(24px, 5vmin, 38px); font-weight: 900; }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 16px; }
  .type { padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: clamp(13px, 2.4vmin, 17px); text-transform: capitalize; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .pill { padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: clamp(13px, 2.4vmin, 17px); background: rgba(255,255,255,.18); }
  .pill.new { background: var(--yellow); color: var(--ink); }
  .pill.shiny { background: linear-gradient(90deg, #ffe36e, #ff9dd6); color: var(--ink); }
  .pill.tier-legendary { background: #7c3aed; } .pill.tier-mythical { background: #db2777; } .pill.tier-rare { background: #2563eb; }
  #result .total { opacity: .85; margin-bottom: 18px; font-size: clamp(15px, 2.8vmin, 20px); }

  #pokedex { background: var(--ink); justify-content: flex-start; padding-top: calc(var(--sat) + 12px); }
  #pokedex .bar { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  #pokedex .bar h2 { margin: 0; font-size: clamp(22px, 4.5vmin, 34px); color: var(--yellow); -webkit-text-stroke: 1px var(--blue); text-shadow: 2px 2px 0 var(--blue); }
  #pokedex .count { font-weight: 800; opacity: .9; font-size: clamp(14px, 2.6vmin, 18px); }
  #dexGrid {
    width: 100%; max-width: 900px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); padding-bottom: 20px;
  }
  .card {
    background: rgba(255,255,255,.1); border-radius: 14px; padding: 8px 6px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
  }
  .card img { width: 80px; height: 80px; image-rendering: pixelated; }
  .card .n { font-weight: 800; font-size: 14px; }
  .card .id { font-size: 12px; opacity: .6; }
  .card .c { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.45); padding: 2px 7px; border-radius: 999px; }
  .card .s { position: absolute; top: 6px; left: 8px; font-size: 14px; }
  .empty { opacity: .75; margin-top: 40px; font-size: clamp(16px, 3vmin, 22px); }
  #stats { opacity: .6; font-size: 13px; margin: 6px 0 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }

<body>
  <video id="cam" autoplay muted playsinline class="hidden"></video>
  <div id="nocam"></div>
  <canvas id="gl"></canvas>
  <div id="look"></div>
  <div id="world"></div>
  <div id="labels"></div>
  <div id="edges"></div>
  <div id="ball" class="hidden"></div>
  <canvas id="fx"></canvas>

  <div id="hud" class="hidden">
    <button id="dexBtn" type="button"><span class="dot"></span><span id="dexCount">0</span></button>
    <button id="muteBtn" type="button" aria-label="Sound on or off">🔊</button>
    <svg id="radar" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <path d="M50 50 L20 6 A50 50 0 0 1 80 6 Z" fill="rgba(255,203,5,.28)"/>
      <circle cx="50" cy="50" r="3.5" fill="#fff"/>
      <g id="radarDots"></g>
    </svg>
    <div id="msg"></div>
  </div>
  <div id="toast"></div>

  <div id="start" class="screen">
    <img class="logo" src="icon-512.png" alt="">
    <h1>Reagan's<br>Pokémon Adventures</h1>
    <p class="sub">Pokémon are hiding all around your room!</p>
    <div class="how">
      <div><span>🔄</span> Turn around to find them</div>
      <div><span>👆</span> Flick the ball to throw</div>
      <div><span>📕</span> Fill up your Pokédex</div>
    </div>
    <button id="startBtn" class="btn" type="button" disabled>Loading Pokémon…</button>
    <p class="note" id="startNote">Uses your camera and motion sensors. Say yes when asked!</p>
  </div>

  <div id="result" class="screen hidden">
    <h2 id="resTitle">Gotcha!</h2>
    <img id="resArt" class="art" src="" alt="">
    <div class="name" id="resName"></div>
    <div class="badges" id="resBadges"></div>
    <div class="total" id="resTotal"></div>
    <button id="resBtn" class="btn" type="button">Keep hunting!</button>
  </div>

  <div id="pokedex" class="screen hidden">
    <div class="bar">
      <h2>Reagan's Pokédex</h2>
      <span class="count" id="dexTotal"></span>
      <button id="dexClose" class="btn ghost" type="button">Back</button>
    </div>
    <div id="stats"></div>
    <div id="dexGrid"></div>
  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// =====================================================================
// 1. CONFIGURATION
// =====================================================================
const CONFIG = {
  storageKey: 'reagans-pokemon-adventures:v1',
  rosterUrl: 'pokemon.json',
  cries: 'cries/',                  // {id}.m4a, built by tools/build-cries.py from PokéAPI's OGG cries
  cryVolume: 0.85,
  mutedKey: 'reagans-pokemon-adventures:muted',
  sprites: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/',
  // 3D models: data files only, fetched by the browser from a pinned commit recorded in pokemon.json
  assetsBase: sha => `https://raw.githubusercontent.com/Pokemon-3D-api/assets/${sha}/models/opt/`,
  draco: 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/',
  model: { minKB: 12, maxKB: 2500, loadTimeoutMs: 15000, idleClip: /idle|wait|stand|breath|loop|relax/i },
  world: { eye: 1.2, fovLong: 68, distMin: 1.3, distMax: 4.5, distPerMetre: 2.5 },
  spawn: { firstDelay: 1500, minDelay: 6000, maxDelay: 12000, maxActive: 3, lifetime: 45000, inViewChance: 0.3 },
  tiers: {
    common:    { weight: 10,  catch: 0.90, label: 'Common' },
    uncommon:  { weight: 6,   catch: 0.80, label: 'Uncommon' },
    rare:      { weight: 3,   catch: 0.65, label: 'Rare' },
    legendary: { weight: 1,   catch: 0.45, label: 'Legendary' },
    mythical:  { weight: 0.4, catch: 0.35, label: 'Mythical' },
  },
  gen1Boost: 1.6,
  shinyRate: 1 / 50,
  maxEscapes: 2,
  escapeBonus: 0.12,
  throw: { minSpeed: 0.35, aimCone: 40, flightMs: 650 },
  wobbleMs: 640,
};
const TYPE_COLORS = {
  normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#E8B900', grass: '#7AC74C', ice: '#5FC7C2',
  fighting: '#C22E28', poison: '#A33EA1', ground: '#D3A94A', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
  rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746', steel: '#8E8EB0', fairy: '#D685AD',
};
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const artUrl = (id, shiny) => CONFIG.sprites + 'other/official-artwork/' + (shiny ? 'shiny/' : '') + id + '.png';
const thumbUrl = id => CONFIG.sprites + id + '.png';

// =====================================================================
// 2. PERSISTENT STATE
// =====================================================================
const DEFAULT_SAVE = { v: 1, caught: {}, stats: { throws: 0, hits: 0, catches: 0, shinies: 0 } };
function loadSave() {
  try {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (!raw) return structuredClone(DEFAULT_SAVE);
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return structuredClone(DEFAULT_SAVE);
    return { v: 1, caught: d.caught || {}, stats: Object.assign({}, DEFAULT_SAVE.stats, d.stats || {}) };
  } catch (e) { return structuredClone(DEFAULT_SAVE); }
}
function persist() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(save)); } catch (e) {} }
const save = loadSave();

// =====================================================================
// 3. LIVE SESSION STATE
// =====================================================================
const S = {
  phase: 'start',            // start | hunt | throw | wobble | result | pokedex
  roster: [], byId: new Map(), cumWeights: [], totalWeight: 0, assetsSha: '',
  sensors: 'unknown',        // unknown | gyro | drag
  look: { yaw: 0, pitch: -15 },   // drag-look fallback, degrees
  active: [], uid: 0,
  spawnTimer: null,
  layout: { w: 0, h: 0, cx: 0, cy: 0, pxPerDeg: 1, spriteBase: 100 },
  ball: { x: 0, y: 0, scale: 1, rot: 0, drag: null, samples: [], attached: null, flight: null },
  hintedThrow: false,
  particles: [],
  lookDrag: null,
  camStream: null,
  lastDots: '',
};

// =====================================================================
// 4. GAME RULES
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap180 = d => ((d + 540) % 360) - 180;

function buildWeights(roster) {
  let total = 0; const cum = [];
  for (const p of roster) {
    const w = (CONFIG.tiers[p.r] || CONFIG.tiers.common).weight * (p.g === 1 ? CONFIG.gen1Boost : 1);
    total += w; cum.push(total);
  }
  S.cumWeights = cum; S.totalWeight = total;
}
function pickSpecies() {
  const r = Math.random() * S.totalWeight;
  let lo = 0, hi = S.cumWeights.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (S.cumWeights[mid] < r) lo = mid + 1; else hi = mid; }
  return S.roster[lo];
}
const rollShiny = () => Math.random() < CONFIG.shinyRate;
const modelOk = kb => kb >= CONFIG.model.minKB && kb <= CONFIG.model.maxKB;
function modelUrl(p, shiny) {
  const base = CONFIG.assetsBase(S.assetsSha);
  if (shiny && modelOk(p.ms)) return { url: base + 'shiny/' + p.i + '.glb', tint: false };
  if (modelOk(p.m)) return { url: base + 'regular/' + p.i + '.glb', tint: shiny };
  return null;
}
const spawnDistance = h => clamp(h * CONFIG.world.distPerMetre, CONFIG.world.distMin, CONFIG.world.distMax) * rand(0.9, 1.15);
function catchChance(spawn) {
  const base = (CONFIG.tiers[spawn.p.r] || CONFIG.tiers.common).catch;
  return clamp(base + spawn.escapes * CONFIG.escapeBonus, 0, 0.97);
}

// =====================================================================
// 5. THE 3D SCENE: renderer, camera driven by the phone's orientation, lights, floor

// clone a cached glTF into a fresh, fitted instance: real height, feet at y=0, centred, idle clip if it has one
function instantiate(gltf, height, tint) {
  const model = SkeletonUtils.clone(gltf.scene);
  model.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false;
    if (tint) { o.material = o.material.clone(); if (o.material.emissive) { o.material.emissive.set(0xffc63a); o.material.emissiveIntensity = 0.45; } }
  });
  model.position.set(0, 0, 0); model.scale.setScalar(1); model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = height / Math.max(size.y, 1e-4);
  model.scale.setScalar(s); model.updateMatrixWorld(true);
  box.setFromObject(model);
  const c = new THREE.Vector3(); box.getCenter(c);
  model.position.set(-c.x, -box.min.y, -c.z);
  let mixer = null;
  const clip = (gltf.animations || []).find(a => CONFIG.model.idleClip.test(a.name));
  if (clip) { mixer = new THREE.AnimationMixer(model); mixer.clipAction(clip).play(); }
  return { model, mixer, fitScale: s };
}

// --- orientation: the standard device-orientation camera, with the screen rotation derived from gravity ---
const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const targetQ = new THREE.Quaternion();
let gotOrientation = false, reportedAngle = 0, physical = { mode: 'unknown', angle: 0 };
function readReportedAngle() {
  const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  reportedAngle = ((a % 360) + 360) % 360;
}
readReportedAngle();
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', readReportedAngle);
window.addEventListener('orientationchange', () => setTimeout(readReportedAngle, 50));
function effectiveAngle() {
  const landscapeLayout = window.innerWidth > window.innerHeight;
  if (landscapeLayout && physical.mode === 'landscape') return physical.angle;
  if (!landscapeLayout && physical.mode === 'portrait') return (physical.angle === 180 && reportedAngle === 180) ? 180 : 0;
  return reportedAngle;
}
function updatePhysical(betaDeg, gammaDeg) {
  const b = betaDeg * D2R, g = gammaDeg * D2R;
  const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b);   // earth "up" in the device frame
  if (Math.abs(ux) > 0.5 && Math.abs(ux) > Math.abs(uy)) physical = { mode: 'landscape', angle: ux > 0 ? 90 : 270 };
  else if (Math.abs(uy) > 0.5 && Math.abs(uy) > Math.abs(ux)) physical = { mode: 'portrait', angle: uy > 0 ? 0 : 180 };
}
function onOrientation(e) {
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  if (!gotOrientation) { gotOrientation = true; S.sensors = 'gyro'; }
  updatePhysical(e.beta, e.gamma);
  euler.set(e.beta * D2R, e.alpha * D2R, -e.gamma * D2R, 'YXZ');
  targetQ.setFromEuler(euler);

}
function enableDragLook(reason) {

// where the camera is looking, as compass-style yaw (deg, 0 = -Z, clockwise positive) and pitch (deg, up positive)
const _fwd = new THREE.Vector3();
function camYawPitch() {

function layout() {
  const L = S.layout;
  L.w = window.innerWidth; L.h = window.innerHeight;
  L.cx = L.w / 2; L.cy = L.h / 2;
  L.pxPerDeg = Math.max(L.w, L.h) / CONFIG.world.fovLong;
  L.spriteBase = Math.min(L.w, L.h) * 0.36;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  el.fx.width = Math.round(L.w * dpr); el.fx.height = Math.round(L.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderer.setSize(L.w, L.h, false);
  camera.aspect = L.w / L.h;
  const long = CONFIG.world.fovLong * D2R;
  camera.fov = (L.h >= L.w ? long : 2 * Math.atan(Math.tan(long / 2) * L.h / L.w)) / D2R;
  camera.updateProjectionMatrix();
  const b = ballSize();
  L.ballHome = { x: L.cx, y: L.h - safeBottom() - 36 - b / 2 };
  if (!S.ball.drag && !S.ball.flight && !S.ball.attached) { S.ball.x = L.ballHome.x; S.ball.y = L.ballHome.y; }
}
function ballSize() { return el.ball.offsetWidth || 96; }
function safeBottom() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sab');
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}
function countCaught() { return Object.keys(save.caught).length; }
function renderHud() { el.dexCount.textContent = countCaught(); }

// project a world point to the screen; `front` is false when it is behind the camera
const _v = new THREE.Vector3();
function project(x, y, z) {
  _v.set(x, y, z).project(camera);
  const L = S.layout;
  return { x: (_v.x + 1) / 2 * L.w, y: (1 - _v.y) / 2 * L.h, front: _v.z > -1 && _v.z < 1 };
}
// screen-space view of a spawn: centre, feet, head, whether it is on screen, and which way to turn to see it
function screenPos(spawn) {
  const L = S.layout, cam = camYawPitch();
  const mid = project(spawn.x, spawn.h * 0.5, spawn.z);
  const feet = project(spawn.x, 0, spawn.z);
  const head = project(spawn.x, spawn.h + 0.12, spawn.z);
  const dyaw = wrap180(spawn.yaw - cam.yaw);
  const tpitch = Math.atan2(spawn.h * 0.5 - CONFIG.world.eye, spawn.dist) * R2D;
  const dpitch = tpitch - cam.pitch;
  const m = Math.max(40, Math.abs(feet.y - head.y));
  const on = mid.front && Math.abs(dyaw) < 90 && mid.x > -m && mid.x < L.w + m && mid.y > -m && mid.y < L.h + m;
  return { x: mid.x, y: mid.y, feet, head, on, front: mid.front, dx: dyaw * L.pxPerDeg, dy: -dpitch * L.pxPerDeg, dyaw };
}
function chooseTarget(vec, from) {
  let best = null, bestAng = CONFIG.throw.aimCone;
  const L = S.layout;
  for (const sp of S.active) {
    if (sp.state !== 'idle') continue;
    const pos = screenPos(sp);
    if (!pos.front || pos.x < -L.w * 0.1 || pos.x > L.w * 1.1 || pos.y < -L.h * 0.1 || pos.y > L.h * 0.92) continue;
    const tx = pos.x - from.x, ty = pos.y - from.y;
    const len = Math.hypot(tx, ty) || 1;
    const ang = Math.acos(clamp((tx * vec.x + ty * vec.y) / len, -1, 1)) * R2D;
    if (ang < bestAng) { bestAng = ang; best = sp; }
  }

}

// tiny tween helper driven by the render loop
const tweens = new Set();
function tween(ms, step, done) {
  const t0 = performance.now();
  const tw = { tick(now) { const t = clamp((now - t0) / ms, 0, 1); step(t); if (t >= 1) { tweens.delete(tw); done && done(); } } };
  tweens.add(tw); return tw;
}
const easeOutBack = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
const easeIn = t => t * t;

const clock = new THREE.Clock();
function renderFrame(now) {
  const dt = clock.getDelta();
  if (S.sensors === 'gyro') camera.quaternion.slerp(targetQ, 0.3);
  else camera.quaternion.setFromEuler(new THREE.Euler(S.look.pitch * D2R, -S.look.yaw * D2R, 0, 'YXZ'));
  for (const tw of Array.from(tweens)) tw.tick(now);
  const L = S.layout;

  let dots = '';
  for (const sp of S.active) {
    const pos = screenPos(sp);
    if (sp.mixer) sp.mixer.update(dt);
    else if (sp.model && sp.state === 'idle') sp.model.scale.y = sp.fitScale * (1 + Math.sin(now / 600 + sp.uid) * 0.012);
    if (sp.el && (sp.state === 'idle' || sp.state === 'flee')) {
      // 2D fallback: size it like a real object of its height at its distance, feet on the floor
      const px = clamp(Math.abs(pos.head.y - pos.feet.y) * 1.05, 48, L.h * 0.8);
      sp.el.style.setProperty('--sz', px + 'px');
      sp.el.style.transform = `translate3d(${pos.feet.x - px / 2}px, ${pos.feet.y - px}px, 0)`;
      sp.el.classList.toggle('on', pos.on);
    }
    const showTag = (sp.state === 'idle' || sp.state === 'flee') && pos.on;
    sp.tag.classList.toggle('on', showTag);
    if (showTag) sp.tag.style.transform = `translate3d(${pos.head.x}px, ${pos.head.y}px, 0) translate(-50%, -100%)`;
    const showEdge = sp.state === 'idle' && !pos.on;
    sp.edge.style.display = showEdge ? 'flex' : 'none';
    if (showEdge) {
      const ang = Math.atan2(pos.dy, pos.dx);
      const inset = 46 + safeBottom();
      const hw = L.cx - inset, hh = L.cy - inset - 60;
      const t = Math.min(hw / Math.abs(Math.cos(ang) || 1e-6), hh / Math.abs(Math.sin(ang) || 1e-6));
      const ex = L.cx + Math.cos(ang) * t, ey = L.cy + Math.sin(ang) * t + 30;
      sp.edge.style.transform = `translate3d(${ex}px, ${ey}px, 0) translate(-50%, -50%)`;
      sp.edgeArrow.style.transform = `rotate(${ang * R2D}deg)`;
    }
    if (sp.state === 'idle') {
      const a = pos.dyaw * D2R;
      const rx = 50 + Math.sin(a) * 36, ry = 50 - Math.cos(a) * 36;
      const col = sp.shiny ? '#ffe36e' : (sp.p.r === 'legendary' || sp.p.r === 'mythical') ? '#c084fc' : '#ff5252';
      dots += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
    }
  }
  if (dots !== S.lastDots) { el.radarDots.innerHTML = dots; S.lastDots = dots; }

  const B = S.ball;
  if (B.flight) stepFlight(now);
  else if (B.attached) { const g = project(B.attached.x, 0, B.attached.z); B.x = g.x; B.y = g.y - 6; }
  const b = ballSize();
  el.ball.style.transform = `translate3d(${B.x - b / 2}px, ${B.y - b / 2}px, 0) scale(${B.scale}) rotate(${B.rot}deg)`;

  renderer.render(scene, camera);
  stepParticles();
  requestAnimationFrame(renderFrame);
}

let audio = null, master = null;
let muted = false;
try { muted = localStorage.getItem(CONFIG.mutedKey) === '1'; } catch (e) {}
function initAudio() {
  if (!audio) {
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      master = audio.createGain(); master.connect(audio.destination);
    } catch (e) { audio = null; return; }
  }
  if (audio.state === 'suspended' && audio.resume) audio.resume().catch(() => {});
  applyMute();
}
function applyMute() {
  if (master) master.gain.value = muted ? 0 : 1;
  el.muteBtn.textContent = muted ? '🔇' : '🔊';
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(CONFIG.mutedKey, muted ? '1' : '0'); } catch (e) {}
  applyMute();
}
const cryCache = new Map();
function loadCry(id) {
  if (cryCache.has(id)) return cryCache.get(id);
  const job = (async () => {
    const r = await fetch(CONFIG.cries + id + '.m4a');
    if (!r.ok) throw new Error('cry ' + r.status);
    const data = await r.arrayBuffer();
    if (!audio) throw new Error('no audio');
    return await new Promise((res, rej) => audio.decodeAudioData(data, res, rej));
  })();
  job.catch(() => cryCache.delete(id));
  cryCache.set(id, job);
  return job;
}
async function playCry(id, vol = CONFIG.cryVolume) {
  if (!audio) return false;
  try {
    const buf = await loadCry(id);
    const src = audio.createBufferSource(); src.buffer = buf;
    const g = audio.createGain(); g.gain.value = vol;
    src.connect(g).connect(master); src.start();
    return true;
  } catch (e) { return false; }
}
function tone(freq, dur, type = 'sine', vol = 0.25, slideTo = null, when = 0) {
  if (!audio) return;
  const t0 = audio.currentTime + when;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol = 0.2, from = 800, to = 200) {
  if (!audio) return;
  const n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource(); src.buffer = buf;
  const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(from, audio.currentTime);
  f.frequency.exponentialRampToValueAtTime(to, audio.currentTime + dur);
  const g = audio.createGain(); g.gain.setValueAtTime(vol, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  src.connect(f).connect(g).connect(master); src.start();
}
const sfx = {
  whoosh: () => noise(0.35, 0.3, 300, 2500),
  hit: () => { tone(900, 0.15, 'square', 0.15, 300); noise(0.12, 0.15, 3000, 800); },
  tick: () => tone(420, 0.08, 'square', 0.12, 380),
  catch: () => { tone(660, 0.14, 'triangle', 0.3); tone(880, 0.14, 'triangle', 0.3, null, 0.14); tone(1320, 0.5, 'triangle', 0.3, null, 0.28); },
  escape: () => { tone(500, 0.3, 'sawtooth', 0.18, 180); noise(0.25, 0.25, 2000, 400); },
  spawn: () => { tone(1200, 0.12, 'sine', 0.12); tone(1600, 0.18, 'sine', 0.12, null, 0.1); },
  flee: () => tone(700, 0.35, 'sine', 0.12, 250),
  miss: () => tone(300, 0.2, 'triangle', 0.12, 200),
};

function burst(x, y, n, colors, speed = 6, gravity = 0.18, life = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
    S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.4, g: gravity, life, max: life,
      c: colors[i % colors.length], r: rand(3, 7), shape: Math.random() < 0.5 ? 'rect' : 'dot', rot: Math.random() * 6, vr: rand(-0.2, 0.2) });
  }
}
function confetti() {
  const L = S.layout, cols = ['#ffcb05', '#2a5bd7', '#ff5252', '#4ade80', '#f472b6', '#fff'];
  for (let i = 0; i < 140; i++) {
    S.particles.push({ x: rand(0, L.w), y: rand(-L.h * 0.3, 0), vx: rand(-1, 1), vy: rand(2, 5), g: 0.06, life: 160, max: 160,
      c: cols[i % cols.length], r: rand(4, 8), shape: 'rect', rot: Math.random() * 6, vr: rand(-0.15, 0.15) });
  }
}
function stepParticles() {
  const L = S.layout;
  ctx.clearRect(0, 0, L.w, L.h);
  if (!S.particles.length) return;
  const keep = [];
  for (const p of S.particles) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > L.h + 20) continue;
    ctx.globalAlpha = Math.min(1, p.life / (p.max * 0.3));
    ctx.fillStyle = p.c;
    if (p.shape === 'dot') { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    keep.push(p);
  }
  ctx.globalAlpha = 1;
  S.particles = keep;
}
function stepFlight(now) {
  const B = S.ball, F = B.flight;
  const t = clamp((now - F.t0) / F.dur, 0, 1);
  const e = 1 - Math.pow(1 - t, 2);
  let ex = F.ex, ey = F.ey;
  if (F.target) { const pos = screenPos(F.target); ex = pos.x; ey = pos.y; }
  B.x = F.sx + (ex - F.sx) * e;
  B.y = F.sy + (ey - F.sy) * e - Math.sin(t * Math.PI) * F.arc;
  B.scale = 1 - (1 - F.endScale) * e;
  B.rot = F.spin * t;
  if (t >= 1) { B.flight = null; F.done(); }
}
const ballScaleFor = spawn => clamp(1.3 / spawn.dist, 0.3, 0.75);

// =====================================================================
function preload(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function scheduleSpawn(delay) { clearTimeout(S.spawnTimer); S.spawnTimer = setTimeout(spawnOne, delay); }

async function spawnOne() {
  if (S.phase !== 'hunt') { scheduleSpawn(2000); return; }
  if (S.active.filter(s => s.state === 'idle').length >= CONFIG.spawn.maxActive) { scheduleSpawn(2500); return; }
  const p = pickSpecies(), shiny = rollShiny();
  const asset = await prepareAsset(p, shiny);
  if (!asset) { scheduleSpawn(1500); return; }
  if (S.phase !== 'hunt') { scheduleSpawn(1500); return; }
  placeSpawn(p, shiny, asset);
  scheduleSpawn(rand(CONFIG.spawn.minDelay, CONFIG.spawn.maxDelay));
}
// fetch what this Pokémon needs before it appears: its 3D model (or the 2D artwork as fallback) and its cry
async function prepareAsset(p, shiny, force2d) {
  const cryJob = loadCry(p.i).catch(() => null);
  const m = force2d ? null : modelUrl(p, shiny);
  if (m) {
    try {
      const gltf = await withTimeout(loadGLTF(m.url), CONFIG.model.loadTimeoutMs);
      await cryJob;
      return { kind: '3d', gltf, tint: m.tint };
    } catch (e) { /* fall through to the artwork */ }
  }
  try { await preload(artUrl(p.i, shiny)); await cryJob; return { kind: '2d' }; } catch (e) { return null; }
}
function placeSpawn(p, shiny, asset, yawOverride) {
  const cam = camYawPitch();
  let yaw;
  if (yawOverride != null) yaw = yawOverride;
  else if (Math.random() < CONFIG.spawn.inViewChance) yaw = cam.yaw + rand(-CONFIG.world.fovLong * 0.3, CONFIG.world.fovLong * 0.3);
  else yaw = cam.yaw + (Math.random() < 0.5 ? -1 : 1) * rand(35, 160);
  const h = Math.max(0.15, p.h || 1), dist = spawnDistance(h);
  const x = Math.sin(yaw * D2R) * dist, z = -Math.cos(yaw * D2R) * dist;
  const spawn = { uid: ++S.uid, p, shiny, kind: asset.kind, art: artUrl(p.i, shiny), yaw, dist, x, z, h,
    born: performance.now(), escapes: 0, state: 'idle', holder: null, model: null, mixer: null, fitScale: 1, el: null };

  if (asset.kind === '3d') {
    const inst = instantiate(asset.gltf, h, asset.tint);
    const holder = new THREE.Group();
    holder.position.set(x, 0, z);
    holder.lookAt(0, 0, 0);                 // glTF models face +Z; lookAt points +Z at the player
    holder.add(inst.model);
    scene.add(holder);
    Object.assign(spawn, { holder, model: inst.model, mixer: inst.mixer, fitScale: inst.fitScale });
    holder.scale.setScalar(0.001);
    tween(420, t => holder.scale.setScalar(Math.max(0.001, easeOutBack(t))));
  } else {
    const node = document.createElement('div');
    node.className = 'poke' + (shiny ? ' shiny' : '');
    node.innerHTML = `<span class="shadow"></span><img class="img" src="${spawn.art}" alt="" draggable="false">`;
    el.world.appendChild(node);
    spawn.el = node;
  }
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = `${shiny ? '<span class="sp">✨</span> ' : ''}${p.n}`;
  el.labels.appendChild(tag);
  const edge = document.createElement('div');
  edge.className = 'edge'; edge.style.display = 'none';
  edge.innerHTML = `<span class="arrow">➜</span><img src="${thumbUrl(p.i)}" alt="" draggable="false">`;
  el.edges.appendChild(edge);
  Object.assign(spawn, { tag, edge, edgeArrow: edge.firstChild });

  S.active.push(spawn);
  spawn.lifeTimer = setTimeout(() => flee(spawn, false), CONFIG.spawn.lifetime);
  playCry(p.i).then(ok => { if (!ok) sfx.spawn(); });
  if (shiny) toast('✨ A shiny Pokémon appeared! ✨', 2600);
  if (!S.hintedThrow) {
    S.hintedThrow = true;
    setTimeout(() => { if (S.phase === 'hunt') { message('Flick the ball to catch it!', 3000); el.ball.classList.add('hint'); } }, 600);
  }
  return spawn;
}
function removeSpawn(spawn) {
  clearTimeout(spawn.lifeTimer);
  if (spawn.holder) scene.remove(spawn.holder);
  if (spawn.el) spawn.el.remove();
  spawn.tag.remove(); spawn.edge.remove();
  S.active = S.active.filter(s => s !== spawn);
}
function flee(spawn, loud) {
  if (spawn.state !== 'idle') return;
  spawn.state = 'flee';
  if (spawn.holder) {
    const h = spawn.holder;
    tween(900, t => { h.scale.setScalar(Math.max(0.001, 1 - easeIn(t))); h.position.y = t * 1.2; });
  } else if (spawn.el) {
    spawn.el.classList.add('flee');
    const px = parseFloat(spawn.el.style.getPropertyValue('--sz')) || 100;
    const pos = screenPos(spawn);
    spawn.el.style.transform = `translate3d(${pos.feet.x - px / 2}px, ${pos.feet.y - px - 160}px, 0)`;
  }
  if (loud) { toast(`${spawn.p.n} ran away!`, 1800); sfx.flee(); }
  setTimeout(() => removeSpawn(spawn), 1000);
}

function throwBall(vec) {
  if (S.phase !== 'hunt') return;
  S.phase = 'throw';
  el.ball.classList.remove('hint');
  save.stats.throws++;
  const from = { x: S.ball.x, y: S.ball.y };
  const target = chooseTarget(vec, from);
  const L = S.layout;
  sfx.whoosh();
  S.ball.flight = {
    t0: performance.now(), dur: CONFIG.throw.flightMs, sx: from.x, sy: from.y,
    ex: from.x + vec.x * L.h * 0.9, ey: from.y + vec.y * L.h * 0.9,
    target, arc: L.h * 0.16, endScale: target ? ballScaleFor(target) : 0.18, spin: 720,
    done: () => target ? hit(target) : miss(),
  };
}
function miss() {
  sfx.miss();
  toast('Missed!', 1000);
  el.ball.classList.add('burst');
  setTimeout(() => { resetBall(); S.phase = 'hunt'; }, 350);
}
function resetBall() {
  const B = S.ball, L = S.layout;
  B.flight = null; B.attached = null; B.scale = 1; B.rot = 0;
  B.x = L.ballHome.x; B.y = L.ballHome.y;
  el.ball.classList.remove('burst', 'wobble', 'glow');
}
async function hit(spawn) {
  save.stats.hits++;
  sfx.hit();
  S.phase = 'wobble';
  const pos = screenPos(spawn);
  burst(pos.x, pos.y, 26, ['#fff', '#ffe36e', '#ff8a8a'], 7, 0.12, 40);
  spawn.state = 'inBall';
  clearTimeout(spawn.lifeTimer);
  // the Pokémon shrinks into the ball
  if (spawn.holder) {
    const h = spawn.holder;
    tween(380, t => h.scale.setScalar(Math.max(0.001, 1 - easeIn(t))));
  } else if (spawn.el) {
    const px = parseFloat(spawn.el.style.getPropertyValue('--sz')) || 100;
    spawn.el.classList.add('absorb');
    spawn.el.style.transform = `translate3d(${S.ball.x - px / 2}px, ${S.ball.y - px / 2}px, 0) scale(0)`;
  }
  await wait(380);
  if (spawn.el) spawn.el.classList.remove('on');
  // the ball drops to the floor where the Pokémon stood
  S.ball.attached = spawn; S.ball.scale = ballScaleFor(spawn); S.ball.rot = 0;
  await wait(320);
  const caught = Math.random() < catchChance(spawn);
  const wobbles = caught ? 3 : 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < wobbles; i++) {
    el.ball.classList.remove('wobble'); void el.ball.offsetWidth; el.ball.classList.add('wobble');
    sfx.tick();
    await wait(CONFIG.wobbleMs + 120);
  }
  if (caught) return captured(spawn);
  // broke free
  sfx.escape();
  setTimeout(() => playCry(spawn.p.i, 0.7), 250);
  el.ball.classList.add('burst');
  spawn.escapes++;
  spawn.state = 'idle';
  if (spawn.holder) { const h = spawn.holder; tween(450, t => h.scale.setScalar(Math.max(0.001, easeOutBack(t)))); }
  else if (spawn.el) { spawn.el.classList.remove('absorb'); spawn.el.classList.add('pop', 'on'); setTimeout(() => spawn.el.classList.remove('pop'), 500); }
  await wait(350);
  resetBall();
  S.phase = 'hunt';
  if (spawn.escapes >= CONFIG.maxEscapes) { flee(spawn, true); }
  else { toast(`${spawn.p.n} broke free!`, 1500); spawn.lifeTimer = setTimeout(() => flee(spawn, false), CONFIG.spawn.lifetime); }
}
async function captured(spawn) {
  sfx.catch();
  el.ball.classList.add('glow');
  burst(S.ball.x, S.ball.y, 40, ['#ffe36e', '#fff', '#ffcb05'], 8, 0.1, 55);
  const id = spawn.p.i;
  const rec = save.caught[id] || { c: 0, s: 0, f: new Date().toISOString() };
  const isNew = rec.c === 0;
  rec.c++; if (spawn.shiny) rec.s++;
  save.caught[id] = rec;
  save.stats.catches++; if (spawn.shiny) save.stats.shinies++;
  persist(); renderHud();
  await wait(650);
  removeSpawn(spawn);
  resetBall();
  S.phase = 'result';
  confetti();
  renderResult(spawn, isNew);
  playCry(spawn.p.i);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// =====================================================================
// 9. INPUT: camera, pointer, buttons
// =====================================================================
async function enableCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    S.camStream = stream;
    el.cam.srcObject = stream;
    el.cam.classList.remove('hidden');
    await el.cam.play().catch(() => {});
    return true;
  } catch (e) { return false; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || S.phase === 'start') return;
  const track = S.camStream && S.camStream.getVideoTracks()[0];
  if (!track || track.readyState === 'ended') await enableCamera();
  else el.cam.play().catch(() => {});
});

// pokeball drag + flick
el.ball.addEventListener('pointerdown', e => {
  if (S.phase !== 'hunt') return;
  e.preventDefault();
  el.ball.setPointerCapture(e.pointerId);
  el.ball.classList.remove('hint');
  S.ball.drag = { id: e.pointerId, ox: e.clientX - S.ball.x, oy: e.clientY - S.ball.y };
  S.ball.samples = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
});
el.ball.addEventListener('pointermove', e => {
  const d = S.ball.drag; if (!d || d.id !== e.pointerId) return;
  e.preventDefault();
  S.ball.x = e.clientX - d.ox; S.ball.y = e.clientY - d.oy;
  const s = S.ball.samples; s.push({ t: performance.now(), x: e.clientX, y: e.clientY });
  while (s.length > 12) s.shift();
});
function endDrag(e) {
  const d = S.ball.drag; if (!d || d.id !== e.pointerId) return;
  S.ball.drag = null;
  const s = S.ball.samples, now = performance.now();
  let recent = s.filter(p => now - p.t <= 100);
  if (recent.length < 2) recent = s.slice(-2);
  const a = recent[0], b = recent[recent.length - 1];
  if (!a || !b || a === b) { resetBall(); return; }
  const dt = clamp(b.t - a.t, 1, 150), dx = b.x - a.x, dy = b.y - a.y;
  const speed = Math.hypot(dx, dy) / dt;
  if (speed >= CONFIG.throw.minSpeed && dy < 0) {
    const len = Math.hypot(dx, dy);
    throwBall({ x: dx / len, y: dy / len });
  } else {
    resetBall();
  }
}
el.ball.addEventListener('pointerup', endDrag);
el.ball.addEventListener('pointercancel', endDrag);

// drag-to-look fallback (only when there are no motion sensors)
el.look.addEventListener('pointerdown', e => {
  if (S.sensors !== 'drag' || S.phase !== 'hunt') return;
  S.lookDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  el.look.setPointerCapture(e.pointerId);
});
el.look.addEventListener('pointermove', e => {
  const d = S.lookDrag; if (!d || d.id !== e.pointerId) return;
  const L = S.layout;
  S.look.yaw -= (e.clientX - d.x) / L.pxPerDeg;
  S.look.pitch = clamp(S.look.pitch + (e.clientY - d.y) / L.pxPerDeg, -85, 85);
  d.x = e.clientX; d.y = e.clientY;
});
const endLook = e => { if (S.lookDrag && S.lookDrag.id === e.pointerId) S.lookDrag = null; };
el.look.addEventListener('pointerup', endLook);
el.look.addEventListener('pointercancel', endLook);
window.addEventListener('keydown', e => {
  if (S.sensors !== 'drag') return;
  const step = 6;
  if (e.key === 'ArrowLeft') S.look.yaw -= step; if (e.key === 'ArrowRight') S.look.yaw += step;
  if (e.key === 'ArrowUp') S.look.pitch = clamp(S.look.pitch + step, -85, 85); if (e.key === 'ArrowDown') S.look.pitch = clamp(S.look.pitch - step, -85, 85);
});

el.startBtn.addEventListener('click', startGame);
el.resBtn.addEventListener('click', () => { el.result.classList.add('hidden'); S.phase = 'hunt'; });
el.dexBtn.addEventListener('click', () => { if (S.phase !== 'hunt') return; S.phase = 'pokedex'; renderPokedex(); el.pokedex.classList.remove('hidden'); });
el.dexClose.addEventListener('click', () => { el.pokedex.classList.add('hidden'); S.phase = 'hunt'; });
el.muteBtn.addEventListener('click', () => { initAudio(); toggleMute(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

async function startGame() {
  el.startBtn.disabled = true;
  initAudio();
  const motionPromise = enableMotion();           // must start inside the tap
  const camOk = await enableCamera();
  const motionOk = await motionPromise;
  el.start.classList.add('hidden');
  el.hud.classList.remove('hidden');
  el.ball.classList.remove('hidden');
  layout(); resetBall(); renderHud();
  S.phase = 'hunt';
  if (!camOk) { el.nocam.classList.remove('hidden'); grid.visible = true; toast('No camera, but the Pokémon are still here!', 2500); }
  else el.nocam.classList.add('hidden');
  if (!motionOk) enableDragLook('Drag the screen to look around');
  else {
    setTimeout(() => { if (!gotOrientation) enableDragLook('Drag the screen to look around'); else message('Turn around to find Pokémon!', 3500); }, 1500);
  }
  scheduleSpawn(CONFIG.spawn.firstDelay);
}

// =====================================================================
// 10. BOOT
// =====================================================================
async function boot() {
  layout();
  applyMute();
  requestAnimationFrame(renderFrame);
  try {
    const r = await fetch(CONFIG.rosterUrl, { cache: 'force-cache' });
    if (!r.ok) throw new Error('roster ' + r.status);
    const data = await r.json();
    S.roster = data.pokemon;
    S.assetsSha = (data.assets && data.assets.sha) || '';
    for (const p of S.roster) S.byId.set(p.i, p);
    buildWeights(S.roster);
    el.startBtn.textContent = 'Start Adventure!';
    el.startBtn.disabled = false;
  } catch (e) {
    el.startBtn.textContent = 'Could not load Pokémon';
    el.startNote.textContent = 'Check the internet connection and reload the page.';
  }
}
boot();

// debugging hooks for desktop testing (harmless in production)
window.__game = {
  S, CONFIG, save, scene, camera, playCry, cryCache, modelCache, throwBall, layout, screenPos, camYawPitch,
  spawnNow: async (id, shiny, force2d) => { const p = id ? S.byId.get(id) : pickSpecies(); const asset = await prepareAsset(p, !!shiny, !!force2d); return asset ? placeSpawn(p, !!shiny, asset, camYawPitch().yaw) : null; },
};
</script>
